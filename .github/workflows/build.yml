name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake_args: '-G "Visual Studio 17 2022" -A x64'
          - os: macos-latest
            cmake_args: ''
          - os: ubuntu-latest
            cmake_args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate VST3
        id: locate
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "vst3=build/Petrichor_artefacts/Release/VST3/Petrichor.vst3" >> "$GITHUB_OUTPUT"
          else
            echo "vst3=build/Petrichor_artefacts/VST3/Petrichor.vst3" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pluginval (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Install pluginval (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          curl -L -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip"
          unzip pluginval.zip -d pluginval
          chmod +x pluginval/pluginval.app/Contents/MacOS/pluginval

      - name: Install pluginval (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb unzip zip
          curl -L -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip"
          unzip pluginval.zip -d pluginval
          chmod +x pluginval/pluginval

      - name: Run pluginval (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./pluginval/pluginval.exe --strictness 5 --skip-gui-tests --validate "${{ steps.locate.outputs.vst3 }}"

      - name: Run pluginval (macOS)
        if: matrix.os == 'macos-latest'
        run: ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness 5 --skip-gui-tests --validate "${{ steps.locate.outputs.vst3 }}"

      - name: Run pluginval (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a ./pluginval/pluginval --strictness 5 --skip-gui-tests --validate "${{ steps.locate.outputs.vst3 }}"

      - name: Package
        shell: bash
        run: |
          VER="$(cat VERSION)"
          case "${{ matrix.os }}" in
            windows-latest) TAG="win64";;
            macos-latest)   TAG="macos";;
            ubuntu-latest)  TAG="linux";;
          esac
          DST="Petrichor-v${VER}-${TAG}"
          mkdir -p "$DST"
          cp -r "${{ steps.locate.outputs.vst3 }}" "$DST/"
          cp README.txt "$DST/README.txt"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path '$DST' -DestinationPath '$DST.zip' -Force"
          else
            zip -r "$DST.zip" "$DST"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Petrichor-${{ matrix.os }}
          path: "*.zip"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
