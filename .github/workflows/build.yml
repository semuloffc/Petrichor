name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            vst3_path: build/Petrichor_artefacts/Release/VST3/Petrichor.vst3
            pluginval_bin: ./pluginval/pluginval.exe
            pluginval_asset: pluginval_Windows.zip
          - os: macos-latest
            name: macOS
            vst3_path: build/Petrichor_artefacts/Release/VST3/Petrichor.vst3
            pluginval_bin: ./pluginval/pluginval.app/Contents/MacOS/pluginval
            pluginval_asset: pluginval_macOS.zip
          - os: ubuntu-latest
            name: Linux
            vst3_path: build/Petrichor_artefacts/VST3/Petrichor.vst3
            pluginval_bin: ./pluginval/pluginval
            pluginval_asset: pluginval_Linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip zip

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -G "Ninja Multi-Config" -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval_asset }}" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Install pluginval (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          curl -L -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval_asset }}"
          unzip pluginval.zip -d pluginval
          chmod +x "${{ matrix.pluginval_bin }}"

      - name: Run pluginval (Windows/macOS)
        if: runner.os != 'Linux'
        run: ${{ matrix.pluginval_bin }} --strictness 5 --skip-gui-tests "${{ matrix.vst3_path }}"

      - name: Run pluginval (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ${{ matrix.pluginval_bin }} --strictness 5 --skip-gui-tests "${{ matrix.vst3_path }}"

      - name: Package
        shell: bash
        run: |
          VER="$(cat VERSION)"
          DST="Petrichor-v${VER}-${{ matrix.name }}"
          mkdir -p "$DST"
          cp -r "${{ matrix.vst3_path }}" "$DST/"
          cp README.txt "$DST/README.txt"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path '$DST' -DestinationPath '$DST.zip' -Force"
          else
            zip -r "$DST.zip" "$DST"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petrichor-${{ matrix.name }}
          path: "*.zip"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
